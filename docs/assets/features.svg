<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="t">
  <title id="t">Features: DAG, paralelo, Cursor SDK, auditoría</title>
  <defs>
    <style>
      .title { font-family: Segoe UI, system-ui, sans-serif; font-size: 16px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .sub { font-family: Segoe UI, system-ui, sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <!-- card 1 -->
  <g transform="translate(20,20)">
    <rect width="200" height="180" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="100" cy="58" r="34" fill="#ffedd5"/>
    <!-- mini DAG -->
    <circle cx="78" cy="48" r="7" fill="#fb923c"/>
    <circle cx="122" cy="48" r="7" fill="#2dd4bf"/>
    <circle cx="100" cy="78" r="7" fill="#fb923c"/>
    <line x1="78" y1="48" x2="100" y2="78" stroke="#94a3b8" stroke-width="2"/>
    <line x1="122" y1="48" x2="100" y2="78" stroke="#94a3b8" stroke-width="2"/>
    <text x="100" y="130" class="title">DAG listo</text>
    <text x="100" y="152" class="sub">descompone el encargo</text>
    <text x="100" y="170" class="sub">en noditos con deps</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(240,20)">
    <rect width="200" height="180" rx="22" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <circle cx="100" cy="58" r="34" fill="#ccfbf1"/>
    <text x="72" y="66" font-size="22">>Š</text>
    <text x="100" y="66" font-size="22">>Š</text>
    <text x="128" y="66" font-size="22">>Š</text>
    <text x="100" y="130" class="title">En paralelo</text>
    <text x="100" y="152" class="sub">varios workers Cursor</text>
    <text x="100" y="170" class="sub">a la vez (ready-set)</text>
  </g>

  <!-- card 3 -->
  <g transform="translate(460,20)">
    <rect width="200" height="180" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="100" cy="58" r="34" fill="#ffedd5"/>
    <text x="100" y="68" font-size="28" text-anchor="middle">>à</text>
    <text x="100" y="130" class="title">Solo Cursor SDK</text>
    <text x="100" y="152" class="sub">sin wrappers de otros</text>
    <text x="100" y="170" class="sub">LLMs · 100% gratis MIT</text>
  </g>

  <!-- card 4 -->
  <g transform="translate(680,20)">
    <rect width="200" height="180" rx="22" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <circle cx="100" cy="58" r="34" fill="#ccfbf1"/>
    <text x="100" y="68" font-size="28" text-anchor="middle">=Ò</text>
    <text x="100" y="130" class="title">Auditoría</text>
    <text x="100" y="152" class="sub">SQLite append-only</text>
    <text x="100" y="170" class="sub">+ grafo ASCII</text>
