<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="t d">
  <title id="t">Anne Agent</title>
  <desc id="d">Banner con zorrita Anne y nodos del DAG</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ef"/>
      <stop offset="55%" stop-color="#ffe8d6"/>
      <stop offset="100%" stop-color="#d9f3f0"/>
    </linearGradient>
    <linearGradient id="fox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a4a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f97316" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="960" height="220" rx="28" fill="url(#sky)"/>
  <circle cx="820" cy="40" r="50" fill="#ffd7b5" opacity="0.55"/>
  <circle cx="90" cy="180" r="40" fill="#b8ebe4" opacity="0.55"/>

  <!-- floating DAG nodes -->
  <g stroke="#2dd4bf" stroke-width="3" fill="none" opacity="0.85">
    <line x1="620" y1="70" x2="690" y2="110"/>
    <line x1="690" y1="110" x2="760" y2="70"/>
    <line x1="690" y1="110" x2="690" y2="165"/>
    <line x1="690" y1="165" x2="760" y2="165"/>
  </g>
  <circle cx="620" cy="70" r="12" fill="#fb923c"/>
  <circle cx="690" cy="110" r="14" fill="#2dd4bf"/>
  <circle cx="760" cy="70" r="12" fill="#fb923c"/>
  <circle cx="690" cy="165" r="12" fill="#fb923c"/>
  <circle cx="760" cy="165" r="12" fill="#2dd4bf"/>

  <!-- cute fox face -->
  <g filter="url(#soft)" transform="translate(70,36)">
    <ellipse cx="70" cy="95" rx="58" ry="52" fill="url(#fox)"/>
    <path d="M28 55 L18 8 L55 38 Z" fill="url(#fox)"/>
    <path d="M112 55 L122 8 L85 38 Z" fill="url(#fox)"/>
    <path d="M28 48 L24 18 L48 40 Z" fill="#fff7ed"/>
    <path d="M112 48 L116 18 L92 40 Z" fill="#fff7ed"/>
    <ellipse cx="70" cy="108" rx="34" ry="28" fill="#fff7ed"/>
    <circle cx="52" cy="88" r="7" fill="#0f172a"/>
    <circle cx="88" cy="88" r="7" fill="#0f172a"/>
    <circle cx="54" cy="86" r="2.2" fill="#fff"/>
    <circle cx="90" cy="86" r="2.2" fill="#fff"/>
    <ellipse cx="70" cy="102" rx="5" ry="3.5" fill="#0f172a"/>
    <path d="M70 105 Q62 114 54 110" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M70 105 Q78 114 86 110" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="100" r="6" fill="#fda4af" opacity="0.7"/>
    <circle cx="100" cy="100" r="6" fill="#fda4af" opacity="0.7"/>
    <!-- headphones -->
    <path d="M30 78 Q70 48 110 78" stroke="#134e4a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="18" y="74" width="18" height="26" rx="8" fill="#134e4a"/>
    <rect x="104" y="74" width="18" height="26" rx="8" fill="#134e4a"/>
    <text x="113" y="92" font-size="9" fill="#5eead4" font-family="ui-monospace,monospace" font-weight="700">&gt;_</text>
  </g>

  <text x="250" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="54" font-weight="800" fill="#0f172a">Anne Agent</text>
  <text x="250" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#475569">tu orquestadora multiagente · Cursor SDK</text>
  <text x="250" y="178" font-family="ui-monospace,monospace" font-size="16" fill="#0d9488">encargo ’ DAG ’ paralelo ’ listo &</text>
</svg>
