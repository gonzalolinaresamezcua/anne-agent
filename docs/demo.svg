<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Anne Agent demo</title>
  <desc id="desc">Terminal demo: anne run convierte un encargo en DAG y lo ejecuta en paralelo</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#122033"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="24" y="56" width="832" height="340" rx="10"/>
    </clipPath>
    <style>
      .line { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #d7e2f0; }
      .muted { fill: #7f91a8; }
      .green { fill: #3dd68c; }
      .cyan { fill: #5ec8ff; }
      .yellow { fill: #f0c674; }
      .prompt { fill: #8be9fd; }
      .fade { opacity: 0; animation: fadeIn 0.4s ease forwards; }
      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
    </style>
  </defs>

  <rect width="880" height="420" rx="18" fill="url(#bg)"/>
  <rect x="16" y="16" width="848" height="388" rx="14" fill="#0a101a" stroke="#243247" stroke-width="1"/>

  <circle cx="44" cy="40" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="40" r="6" fill="#febc2e"/>
  <circle cx="88" cy="40" r="6" fill="#28c840"/>
  <text x="440" y="45" text-anchor="middle" class="line muted" font-size="13">anne-agent - demo</text>

  <g clip-path="url(#screen)">
    <text x="40" y="90" class="line fade" style="animation-delay:0.2s"><tspan class="prompt">$</tspan> anne run "Crea un CLI hello-world en TypeScript con tests"</text>

    <text x="40" y="126" class="line muted fade" style="animation-delay:0.9s">[describe] Encargo recibido</text>
    <text x="40" y="152" class="line muted fade" style="animation-delay:1.4s">[analyze] Riesgo bajo · dominio: tooling</text>
    <text x="40" y="178" class="line cyan fade" style="animation-delay:1.9s">[plan] DAG: 4 nodos · maxParallel=3</text>

    <text x="40" y="214" class="line yellow fade" style="animation-delay:2.5s">[execute] &gt; scaffold-cli   &gt; add-tests   &gt; write-readme</text>
    <text x="40" y="240" class="line green fade" style="animation-delay:3.3s">[execute] OK scaffold-cli   OK add-tests   OK write-readme</text>
    <text x="40" y="266" class="line yellow fade" style="animation-delay:3.9s">[execute] &gt; verify-package</text>
    <text x="40" y="292" class="line green fade" style="animation-delay:4.5s">[verify] QA OK · 0 nodos reabiertos</text>
    <text x="40" y="318" class="line green fade" style="animation-delay:5.1s">[deliver] Listo en ./demo · auditoria guardada</text>

    <text x="40" y="360" class="line fade" style="animation-delay:5.7s"><tspan class="prompt">$</tspan> anne graph<tspan class="cursor"> _</tspan></text>
  </g>
</svg>
